<div class="p-6 max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Produtos</h1>
    <button
      (click)="onNew()"
      class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2.5 font-medium text-white shadow-sm transition-all hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 active:scale-[0.98]">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Novo produto
    </button>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-emerald-600"></div>
    </div>
  }

  @else if (isEmpty()) {
    <div class="flex flex-col items-center gap-3 rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-slate-500">
      <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
      </svg>
      <p class="text-lg">Nenhum produto cadastrado.</p>
      <button (click)="onNew()" class="text-emerald-600 font-medium hover:underline">
        Cadastrar primeiro produto
      </button>
    </div>
  }

  @else {
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-slate-600">Nome</th>
            <th class="px-4 py-3 text-left font-medium text-slate-600">Categoria</th>
            <th class="px-4 py-3 text-left font-medium text-slate-600">Preço</th>
            <th class="px-4 py-3 text-left font-medium text-slate-600">Status</th>
            <th class="px-4 py-3 text-right font-medium text-slate-600">Ações</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (product of products(); track product.id) {
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="px-4 py-3 font-medium text-slate-900">{{ product.name }}</td>
              <td class="px-4 py-3 text-slate-600">{{ product.category }}</td>
              <td class="px-4 py-3 text-slate-600">{{ product.price | currency:'BRL' }}</td>
              <td class="px-4 py-3">
                <span [class]="'inline-flex rounded-full px-2.5 py-0.5 text-xs font-medium ' +
                  (product.status === 'ACTIVE' ? 'bg-emerald-100 text-emerald-700' :
                   product.status === 'INACTIVE' ? 'bg-amber-100 text-amber-700' :
                   'bg-rose-100 text-rose-700')">
                  {{ product.status }}
                </span>
              </td>
              <td class="px-4 py-3 text-right">
                <button (click)="onEdit(product.id)" class="text-slate-400 hover:text-emerald-600 p-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                </button>
                <button (click)="onDelete(product)" class="text-slate-400 hover:text-rose-600 p-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>

      <mat-paginator
        [length]="totalElements()"
        [pageSize]="size()"
        [pageSizeOptions]="[10, 20, 50]"
        (page)="onPageChange($event)">
      </mat-paginator>
    </div>
  }
</div>
